<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITS OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Taskbar -->
  <div class="taskbar">
    <div class="start-menu">Start</div>
    <div class="icon-launcher">Icon Launcher</div>
    <div class="search-bar">
      <input type="search" placeholder="Search...">
    </div>
    <div class="bookmark-bar">
      <img id="profile-pic" src="profile-pic.jpg" alt="Profile Pic">
      <!-- Add bookmarks here -->
    </div>
    <div class="clock" id="clock-taskbar">00:00</div>
  </div>

  <!-- Desktop -->
  <div class="desktop">
    <h1 id="desktops-name">ITS OS</h1>
    <div class="big-clock" id="clock">00:00:00</div>
    <div class="search-bar desktop-search-bar">
      <input type="search" placeholder="Search...">
    </div>
    <!-- Add desktop icons here -->
    <div class="made-by">Made by callmecoffee3</div>
  </div>

  <!-- App Window -->
  <div class="app-window" style="display: none;">
    <div class="taskbar">
      <div class="start-menu">Start</div>
      <div class="icon-launcher">Icon Launcher</div>
      <div class="search-bar">
        <input type="search" placeholder="Search...">
      </div>
      <div class="bookmark-bar">
        <img id="profile-pic" src="profile-pic.jpg" alt="Profile Pic">
        <!-- Add bookmarks here -->
      </div>
      <div class="clock" id="clock-taskbar">00:00</div>
    </div>
    <div class="nav-menu">
      <!-- Add nav menu items here -->
    </div>
    <div class="content">
      <!-- App content here -->
    </div>
  </div>

  <!-- Core Apps -->
  <div class="core-apps">
    <!-- Add core apps here -->
    <div class="app" id="online-app-store">Online App Store</div>
    <div class="app" id="marketplace">Marketplace</div>
    <div class="app" id="merch-shop">Merch Shop</div>
    <div class="app" id="unknown">Unknown</div>
    <div class="app" id="communication">Communication</div>
    <div class="app" id="calendar">Calendar</div>
    <div class="app" id="calculator">Calculator</div>
    <div class="app" id="notes">Notes</div>
    <div class="app" id="clubs">Clubs</div>
    <div class="app" id="groups">Groups</div>
    <div class="app" id="pages">Pages</div>
    <div class="app" id="church">Church</div>
    <div class="app" id="homework">Homework</div>
    <div class="app" id="praise-reports">Praise Reports</div>
    <div class="app" id="prayer-request">Prayer Request</div>
    <div class="app" id="friends">Friends</div>
    <div class="app" id="follows">Follows</div>
    <div class="app" id="followers">Followers</div>
    <div class="app" id="video">Video</div>
    <div class="app" id="photos">Photos</div>
    <div class="app" id="feed-wall">Feed-Wall</div>
    <div class="app" id="film">Film</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
